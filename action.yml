name: Coders Fast Start
description: Build and attest a public HTTP image for Coders fast-start environments
inputs:
  runtime:
    description: python-3.12 or nodejs-22
    required: true
  start:
    description: Standard HTTP server command, executed inside /app
    required: true
  build:
    description: Optional build command replacing the default dependency and build steps
    default: ''
  context:
    description: Application source directory
    default: '.'
  image:
    description: GHCR package name; defaults to the caller repository
    default: ''
outputs:
  image:
    description: Built package name
    value: ${{ steps.build.outputs.image }}
  digest:
    description: Immutable image digest
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - uses: docker/setup-buildx-action@v3
    - id: build
      shell: bash
      env:
        FAST_RUNTIME: ${{ inputs.runtime }}
        FAST_START: ${{ inputs.start }}
        FAST_BUILD: ${{ inputs.build }}
        FAST_CONTEXT: ${{ inputs.context }}
        FAST_IMAGE: ${{ inputs.image }}
        FAST_ACTION: ${{ github.action_path }}
      run: |
        args=(--runtime "$FAST_RUNTIME" --start "$FAST_START" --context "$FAST_CONTEXT" --push)
        if [ -n "$FAST_BUILD" ]; then args+=(--build "$FAST_BUILD"); fi
        if [ -n "$FAST_IMAGE" ]; then args+=(--image "$FAST_IMAGE"); fi
        python3 "$FAST_ACTION/build.py" "${args[@]}"
    - uses: actions/attest-build-provenance@v3
      with:
        subject-name: ${{ steps.build.outputs.image }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
